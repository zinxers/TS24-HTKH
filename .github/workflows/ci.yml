name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test
      # next build là bước duy nhất bắt server-only khi giao diện lỡ import code server.
      - run: pnpm turbo build --filter=@ts24-htkh/web
      - run: pnpm depcruise
      # Chỉ Postgres; db start tự áp migration và seed.sql.
      - run: pnpm supabase db start
      # Sửa migration mà quên sinh lại type thì fail ở đây.
      - run: pnpm --filter @ts24-htkh/db gen:types
      - run: git diff --exit-code packages/db/src/types.generated.ts
      - run: pnpm --filter @ts24-htkh/db test:db
      - run: pnpm check:rls
